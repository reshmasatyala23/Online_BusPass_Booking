```html
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Bus Pass Booking System</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f2f5f9;
            color: #333;
        }

        header {
            background: #1565c0;
            color: white;
            text-align: center;
            padding: 25px;
        }

        header h1 {
            margin: 0;
        }

        header p {
            margin-top: 8px;
        }

        .container {
            width: 90%;
            max-width: 1000px;
            margin: 30px auto;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 25px;
        }

        .card {
            background: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 3px 10px rgba(0, 0, 0, 0.1);
        }

        .card h2 {
            margin-top: 0;
            color: #1565c0;
        }

        label {
            display: block;
            margin-top: 15px;
            margin-bottom: 5px;
            font-weight: bold;
        }

        input,
        select {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 15px;
        }

        button {
            width: 100%;
            margin-top: 20px;
            padding: 12px;
            border: none;
            border-radius: 5px;
            background: #1565c0;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #0d47a1;
        }

        .result {
            margin-top: 20px;
            padding: 15px;
            border-radius: 5px;
            display: none;
        }

        .success {
            background: #e8f5e9;
            border: 1px solid #4caf50;
            color: #256029;
        }

        .error {
            background: #ffebee;
            border: 1px solid #f44336;
            color: #b71c1c;
        }

        .booking-details {
            margin-top: 10px;
            line-height: 1.8;
        }

        .booking-id {
            font-size: 20px;
            font-weight: bold;
        }

        @media (max-width: 700px) {
            .container {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

    <header>
        <h1>🚌 Bus Pass Booking System</h1>
        <p>Cloud-Based Bus Pass Management System</p>
    </header>

    <div class="container">

        <!-- BOOK BUS PASS -->
        <div class="card">

            <h2>Book a Bus Pass</h2>

            <form id="bookingForm">

                <label for="name">Name</label>
                <input
                    type="text"
                    id="name"
                    placeholder="Enter your name"
                    required
                >

                <label for="email">Email</label>
                <input
                    type="email"
                    id="email"
                    placeholder="Enter your email"
                    required
                >

                <label for="source">Source</label>
                <input
                    type="text"
                    id="source"
                    placeholder="Example: Bangalore"
                    required
                >

                <label for="destination">Destination</label>
                <input
                    type="text"
                    id="destination"
                    placeholder="Example: Mysore"
                    required
                >

                <label for="pass_type">Pass Type</label>

                <select id="pass_type" required>
                    <option value="">Select Pass Type</option>
                    <option value="daily">Daily - ₹100</option>
                    <option value="weekly">Weekly - ₹500</option>
                    <option value="monthly">Monthly - ₹1500</option>
                </select>

                <button type="submit">
                    Book Bus Pass
                </button>

            </form>

            <div id="bookingResult" class="result"></div>

        </div>


        <!-- CHECK BOOKING -->
        <div class="card">

            <h2>Check Existing Booking</h2>

            <p>
                Enter your booking ID to retrieve your bus pass details.
            </p>

            <label for="bookingId">
                Booking ID
            </label>

            <input
                type="text"
                id="bookingId"
                placeholder="Example: BP-A12B34CD"
            >

            <button onclick="checkBooking()">
                Check Booking
            </button>

            <div id="checkResult" class="result"></div>

        </div>

    </div>


    <script>

        /*
         * IMPORTANT:
         * Replace this with your actual API Gateway URL.
         *
         * Example:
         * https://abc123.execute-api.ap-south-1.amazonaws.com/prod/booking
         */

        const API_URL =
            "https://yt9hwlohxh.execute-api.ap-southeast-1.amazonaws.com/prod/booking";


        // ==========================================
        // BOOK BUS PASS - POST REQUEST
        // ==========================================

        document
            .getElementById("bookingForm")
            .addEventListener("submit", async function(event) {

                event.preventDefault();

                const result =
                    document.getElementById("bookingResult");

                result.style.display = "block";
                result.className = "result";
                result.innerHTML = "Booking your bus pass...";


                const bookingData = {

                    name:
                        document.getElementById("name").value,

                    email:
                        document.getElementById("email").value,

                    source:
                        document.getElementById("source").value,

                    destination:
                        document.getElementById("destination").value,

                    pass_type:
                        document.getElementById("pass_type").value
                };


                try {

                    const response = await fetch(
                        API_URL,
                        {
                            method: "POST",

                            headers: {
                                "Content-Type":
                                    "application/json"
                            },

                            body:
                                JSON.stringify(bookingData)
                        }
                    );


                    const data =
                        await response.json();


                    if (response.ok) {

                        result.className =
                            "result success";

                        result.innerHTML = `

                            <h3>✅ Booking Successful</h3>

                            <div class="booking-details">

                                <strong>Booking ID:</strong>

                                <div class="booking-id">
                                    ${data.booking_id}
                                </div>

                                <strong>Name:</strong>
                                ${data.name}<br>

                                <strong>Route:</strong>
                                ${data.source}
                                →
                                ${data.destination}<br>

                                <strong>Pass Type:</strong>
                                ${data.pass_type}<br>

                                <strong>Price:</strong>
                                ₹${data.price}<br>

                                <strong>Status:</strong>
                                ${data.status}

                            </div>

                            <p>
                                Please save your Booking ID.
                                You can use it to check your booking later.
                            </p>

                        `;

                        // Clear form

                        document
                            .getElementById("bookingForm")
                            .reset();

                    }

                    else {

                        result.className =
                            "result error";

                        result.innerHTML = `
                            ❌ Booking failed:
                            ${data.message || "Unknown error"}
                        `;
                    }

                }

                catch (error) {

                    result.className =
                        "result error";

                    result.innerHTML = `
                        ❌ Unable to connect to the server.
                        <br><br>
                        Please check your API Gateway URL,
                        Lambda and CORS configuration.
                    `;

                    console.error(error);
                }

            });


        // ==========================================
        // CHECK BOOKING - GET REQUEST
        // ==========================================

        async function checkBooking() {

            const bookingId =
                document.getElementById("bookingId").value.trim();

            const result =
                document.getElementById("checkResult");


            if (!bookingId) {

                result.style.display = "block";

                result.className =
                    "result error";

                result.innerHTML =
                    "❌ Please enter a Booking ID.";

                return;
            }


            result.style.display = "block";

            result.className = "result";

            result.innerHTML =
                "Searching for booking...";


            try {

                const response = await fetch(

                    API_URL +
                    "?booking_id=" +
                    encodeURIComponent(bookingId)

                );


                const data =
                    await response.json();


                if (response.ok) {

                    const booking =
                        data.booking;


                    result.className =
                        "result success";


                    result.innerHTML = `

                        <h3>✅ Booking Found</h3>

                        <div class="booking-details">

                            <strong>Booking ID:</strong>
                            ${booking.booking_id}
                            <br>

                            <strong>Name:</strong>
                            ${booking.name}
                            <br>

                            <strong>Email:</strong>
                            ${booking.email}
                            <br>

                            <strong>Route:</strong>
                            ${booking.source}
                            →
                            ${booking.destination}
                            <br>

                            <strong>Pass Type:</strong>
                            ${booking.pass_type}
                            <br>

                            <strong>Price:</strong>
                            ₹${booking.price}
                            <br>

                            <strong>Status:</strong>
                            ${booking.status}

                        </div>

                    `;

                }

                else {

                    result.className =
                        "result error";

                    result.innerHTML = `
                        ❌ ${data.message || "Booking not found"}
                    `;

                }

            }

            catch (error) {

                result.className =
                    "result error";

                result.innerHTML = `
                    ❌ Unable to connect to the server.
                `;

                console.error(error);
            }

        }

    </script>

</body>

</html>
```
